[package]
name = "personal_journal"
version = "0.4.0"
edition = "2024"
authors = ["Christerpher Hunter <djhunter67@gmail.com>"]
documentation = "https://github.com/djhunter67/website_template"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "personal_journal"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }
wildcard_imports = "deny"
must_use_candidate = "warn"
enum_glob_use = "deny"
nursery = { level = "deny", priority = 1 }
unwrap_used = "deny"

[profile.release]
overflow-checks = false
lto = "fat"  # LTO can produce better optimized code; 'false', 'fat', 'thin', or 'off'
codegen-units = 16  # Split crate into units to increase parallelism during compilation, may produce slower code; '1 - 256'
panic = "abort"
incremental = false  # Store cache data to disk in the 'target' dir for quicker recompilation
opt-level = 3
strip = "symbols"  # equivalent to strip = true
rpath = false  
debug-assertions = false
debug = false

[profile.dev]
overflow-checks = true
opt-level = 0
strip = "none"
codegen-units = 256
lto = "off"
panic = "unwind"
incremental = true
debug = "line-tables-only"
debug-assertions = false

[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false

[dependencies]
# dev_macros = { path = "../dev_macros" }
actix-files = "0.6.6"
actix-web = "4.9.0"
redis = { version = "1.5.0", features = ["aio", "connection-manager", "r2d2", "tokio-comp"] }
askama = "0.12.1"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
r2d2_sqlite = { version = "0.26.0", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
mongodb = "3.2.0"
futures = "0.3.31"
dotenvy = "0.15.7"
chacha20 = "0.10.0"
hex = "0.4.3"
rand = "0.10.1"
base64 = "0.22.1"
uuid = { version = "1.23.2", features = ["v4"] }
config = "0.15.23"
chrono = { version = "0.4.45", features = ["serde"] }
actix-multipart = { version = "0.8.0", features = ["derive"] }
anyhow = "1.0.104"
rstest = { version = "0.24.0", features = ["async-timeout"] }

[dev-dependencies]
rstest = "0.24.0"
tokio = { version = "1.43.0", features = ["full"] }
dotenvy = "0.15.7"
async-std = "1.13.2"

