name: Build and deploy

on:
  push:
    branches:
      - trunk

concurrency:
  group: personal-blog-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/djhunter67/personal_blog

jobs:
  test:
    name: Test Rust application

    runs-on:
      - self-hosted
      - linux
      - x64

    permissions:
      contents: read

    env:
      APP_ENVIRONMENT: development
      APP_MONGO__URI: ${{ secrets.APP_MONGO__URI }}
      APP_REDIS__URI: ${{ secrets.APP_REDIS__URI }}
      RUST_LOG: info

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify required secrets are available
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APP_MONGO__URI:-}" ]]; then
            echo "::error::DB_URI is missing from GitHub Actions secrets"
            exit 1
          fi

          if [[ -z "${APP_REDIS__URI:-}" ]]; then
            echo "::error::CACHE_URI is missing from GitHub Actions secrets"
            exit 1
          fi

          echo "Database URI secrets are available."

      - name: Run tests
        run: cargo test --locked
  publish:
    name: Build ARM64 image
    needs: test
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=trunk
            type=sha,format=long

      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    needs: publish

    runs-on:
      - self-hosted
      - linux
      - x64

    permissions:
      contents: none

    environment:
      name: production
      url: https://sundaylifeservices.com

    steps:
      - name: Deploy through restricted SSH
        run: |
          ssh \
            -i "$HOME/.ssh/personal_blog_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ripley@10.20.20.32
