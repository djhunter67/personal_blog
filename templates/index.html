{% extends "base.html" %} {% block title %} {{ title }} {{ version  }} {% endblock %} {% block head %} {% endblock %} {% block individual_page_contents %}

<div id="main">
  <section id="main__paths">
    <div hx-ext="response-targets">
      {% if is_logged_in %}    
      <button
        hx-get="/about"
        hx-target="#main"
        hx-swap="innerHTML"
        hx-trigger="click"
        hx-target-error="#any_error">
        ABOUT
      </button>
      <button
        hx-get="/v1/create_post"
        hx-target="#main"
        hx-swap="innerHTML"
        hx-trigger="click"
        hx-target-error="#any_error">
        CREATE POST
      </button>
      {% endif %}
      <div id="any_error"></div>
    </div>
  </section>
  <section id="main__info_cards">    
    {% if is_logged_in %}    
    {% include "parts/posts.part.html" %}
    {% endif %}
  </section>
</div>


{% call super() %} {% endblock %}
