{% extends "base.html" %} {% block title %} {{ title }} {{ version  }} {% endblock %} {% block head %} {% endblock %} {% block individual_page_contents %}

<div id="main">
  <section id="main__paths">
    <div hx-ext="response-targets">
      <button
	hx-get="/about"
	hx-target="#main__info_cards"
	hx-swap="innerHTML"
	hx-push-url="true"
	hx-trigger="click"
	hx-target-error="#any_error">
	ABOUT
      </button>    
      <div id="any_error"></div>
    </div>    
    <button
      hx-get="/schedule"
      hx-target="#main__info_cards"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-trigger="click">
      SCHEDULE
    </button>
    <button
      hx-get="/testimonials"
      hx-target="#main__info_cards"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-target="click">
      TESTIMONIALS
    </button>
    <button
      hx-get="/finances"
      hx-target="#main__info_cards"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-trigger="click">
      FINANCES
    </button>
  </section>
  <section id="main__info_cards">
    {% for (i,card) in content.iter().enumerate() %}
    <div class="card">
      <div class="card__header" id="card__{{i}}">
	<img src="https://i.pravatar.cc/30{{i + 1}}" alt="card image">
	<h2> {{ content_title }} </h2>
      </div>
      <div class="card__text">
	<p>
	  {{ card }}
	</p>
      </div>
    </div>
    {% endfor %}
  </section>
  <section id="main__user_text">
    <form
      hx-post="/v1/submit_text"
      hx-target="#card__1"
      hx-swap="outerHTML"
      >
      <input type="text" name="text_title" placeholder="Place title here" value="test title" required/>
      <textarea name="text_body" placeholder="Enter your text here"  />Test text that ensures this feature will work during development</textarea>
      <input type="text" name="text_footer" placeholder="text author here" value="Hunter, Christerpher" required/>
      <button type="submit">Submit</button>
    </form>
  </section>
</div>

<footer>
  <section id="footer_container">
    <button
      hx-get="/contact"
      hx-target="#main__info_cards"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-trigger="click">
      CONTACT
    </button>
    <button
      hx-get="https://facebook.com"
      hx-push-url="true"
      hx-target="_blank"
      hx-trigger="click">
      FACEBOOK
    </button>
    <button
      hx-get="https://x.com"
      hx-push-url="true"
      hx-target="_top"
      hx-trigger="click">
      TWITTER
    </button>
    <button
      hx-get="https://instagram.com"
      hx-push-url="true"
      hx-target="_top"
      hx-trigger="click">
      INSTAGRAM
    </button>
    <button
      hx-get="/about"
      hx-push-url="true"
      hx-target="#main__info_cards"
      hx-swap="innerHTML"
      hx-trigger="click">
      ABOUT
    </button>
  </section>
  <aside id="footer_container__version">
    V.{{ version }}
  </aside>
</footer>

{% call super() %} {% endblock %}
