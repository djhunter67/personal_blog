{% extends "base.html" %} {% block title %} {{ title }} {% endblock %} {% block head %} {% endblock %} {% block individual_page_contents %}

<section id="login">
  <h1>LOGIN</h1>
  <div id="login__center">
    <form
      id="user_login"
      hx-post="/v1/login_user"
      hx-target="#template_pages"
      hx-swap="outerHTML"
      >
      <label for="email_input">EMAIL:</label>
      <input type="text" id="login__center__username" name="email_input" autocomplete="on" placeholder="EMAIL" >

      <label for="password_input">PASSWORD:</label>
      <input type="password" id="login__center__auth" name="password_input" autocomplete="on" placeholder="PASSWORD">
      <button type="submit">SUBMIT</button>
    </form>
  </div>
</section>


{% call super() %} {% endblock %}
