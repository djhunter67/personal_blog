<form
  hx-post="/v1/update_text"
  hx-swap="innerHTML"
  hx-target="#main"
  hx-trigger="keydown[ctrlKey && key=='Enter'] from:textarea" id="main__info_cards__journaler"
  >
  <input
    id="main__info_cards__journaler__title"
    type="text"
    name="title"
    placeholder="Place title here"
    required
    value="{{ content.get_title() }}"
    >
  <textarea
    id="main__info_cards__journaler__body"
    name="body"
    placeholder="Enter your text here"
    rows="15"
    >{{ content.get_body() }}</textarea>
  <button type="submit">Submit</button>
</form>
