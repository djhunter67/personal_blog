<form
  hx-post="/v1/update_text"
  hx-swap="innerHTML"
  hx-target="#main"
  hx-trigger="click, keydown[ctrlKey && key=='Enter'] from:textarea"
  id="main__info_cards__journaler"
  >
  <input
    id="main__info_cards__journaler__title"
    type="text"
    name="title"
    placeholder="Place title here"
    required
    value="{{ content.get_title() }}"
    >
  <textarea
    id="main__info_cards__journaler__body"
    name="body"
    placeholder="Enter your text here"
    rows="9"
    required
    >{{ content.get_body() }}</textarea>
  <input id="hidden_to_pass_the_post_oid" hidden name="post_oid" value="{{ content.get_post_oid()  }}">
  <button type="submit">Submit</button>
</form>
