<form hx-post="/v1/update_text" hx-swap="innerHTML" hx-target="#main" id="main__info_cards__journaler">
  <input id="main__user_text__journaler__title" type="text" name="title" placeholder="Place title here" required value="{{ content.get_title() }}">
  <textarea id="main__user_text__journaler__body" name="body" placeholder="Enter your text here" rows="15">{{ content.get_body() }}</textarea>
  <input id="main__user_text__journaler__author" type="text" name="author" placeholder="text author here" required value="{{ content.get_author() }}">
  <button type="submit">Submit</button>
</form>
