<section id="main__info_cards">  
  <form hx-post="/v1/submit_text" hx-swap="outerHTML" hx-target="#main__info_cards" id="main__user_text__journaler">
    <input id="main__user_text__journaler__title" type="text" name="title" placeholder="Place title here" value="{{ draft_title }}"
	   required>
    <textarea id="main__user_text__journaler__body" name="body" placeholder="Enter your text here" >{{ draft_body }}</textarea>
    <input id="main__user_text__journaler__author" type="text" name="author" placeholder="text author here"
	   value="{{ draft_author }}" required>
    <button type="submit">Submit</button>
  </form>
</section>
