<section id="main__info_cards">
  {% for (i,card) in content.iter().enumerate() %}
  <div class="card">
    <div class="card__header">
      <img src="https://i.pravatar.cc/30{{i + 1}}" alt="card image">
      <h2> Title: {{ card.get_title() }}  </h2>
      <h3> Author: {{card.get_author()}} </h3>
    </div>
    <div class="card__text" id="card__{{i}}">
      <p>
        {{ card.get_body() }}
      </p>
    </div>
  </div>
  {% endfor %}
  <form hx-post="/v1/submit_text" hx-swap="outerHTML" hx-target="#main__info_cards" id="main__user_text__journaler">
    <input id="main__user_text__journaler__title" type="text" name="title" placeholder="Place title here" value="test title"
	   required>
    <textarea id="main__user_text__journaler__body" name="body" placeholder="Enter your text here" ></textarea>
    <input id="main__user_text__journaler__author" type="text" name="author" placeholder="text author here"
	   value="Hunter, Christerpher" required>
    <input id="hidden_input" type="text" name="email" value={{user}} hidden>
    <button type="submit">Submit</button>
  </form>
</section>
