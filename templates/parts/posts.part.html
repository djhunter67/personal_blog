  {% for (i,card) in content.iter().enumerate() %}
  <div class="card">
    <div class="card__header">
      <img src="https://i.pravatar.cc/30{{i + 1}}" alt="card image">
      <h2>{{ card.get_title() }}</h2>
      <h3>Author: {{card.get_author()}}</h3>
    </div>
    <div class="card__text" id="card__{{i}}">
      <p>
        {{ card.get_body() }}
      </p>
      <h3>
	{{ card.get_date() }} --> User ID: {{ card.get_user_id() }}
      </h3>
    </div>      
      <div
	class="card__buttons"
	>
	<button
	  hx-post="/v1/submit_text"
	  hx-target="#template_pages"
	  hx-swap="outerHTML"
	  hx-vals='{"title": "{{card.get_title()}}", "body": "{{card.get_body()}}", "author": "{{card.get_author()}}"}'
	  type="button"
	  >EDIT
	</button>
	<input
	  enctype="multipart/form-data"
	  hx-post="/v1/post_image"
	  hx-target="#settings_response"
	  hx-swap="innerHTML"
	  type="file"
	  id="profile_image"
	  name="profile_image"
	  accept="image/*"
	  >
      </div>
  </div>

  {% endfor %}
