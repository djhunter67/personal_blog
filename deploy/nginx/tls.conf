server {
    listen 80;
    listen [::]:80;

    server_name sundaylifeservices.com www.sundaylifeservices.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sundaylifeservices.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.sundaylifeservices.com;

    ssl_certificate
        /etc/letsencrypt/live/sundaylifeservices.com/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/sundaylifeservices.com/privkey.pem;

    return 301 https://sundaylifeservices.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name sundaylifeservices.com;

    ssl_certificate
        /etc/letsencrypt/live/sundaylifeservices.com/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/sundaylifeservices.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://app:8123;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}